# The Flutter template ships -Xmx8G with -XX:MaxMetaspaceSize=4G, which cannot
# fit this machine (4 GB RAM, 11 GB commit limit). Sized for a small host: the
# app has no native code. Raise these on a roomier build machine.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.daemon=false
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
