name: nanti_ingatkan_aku
description: "Nanti Ingatkan Aku — offline-first personal memory assistant."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pinned to the versions resolved in pubspec.lock (DEC-06). `any` was only
  # used while the dependency set had not been resolved yet.
  characters: ^1.4.1
  file_picker: ^13.1.0
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  generate: true
